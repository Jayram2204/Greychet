name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only: this workflow only checks the code (lint/build/test). It never
# deploys anything, so it needs no broader token access than reading the repo.
permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - run: forge --version
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - run: pnpm --filter web lint

      - run: pnpm --filter web exec next build
        env:
          # Client-exposed, non-secret app ID (Privy's own design) — falls
          # back to this project's real value so CI works with zero required
          # repo configuration; override with a repo variable if it changes.
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.NEXT_PUBLIC_PRIVY_APP_ID || 'cmte3dv9o00xl0dkyadzjpsdi' }}
